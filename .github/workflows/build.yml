name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish (e.g. v0.5.0). Leave empty to only build artifacts.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-windows:
    name: Windows (installer + portable)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (nsis) and portable
        run: npx electron-builder --win nsis portable --publish never

      - name: Verify Windows packages were produced
        shell: bash
        run: |
          set -euo pipefail
          echo "dist contents:"
          ls -la dist
          ls dist/*Setup*.exe >/dev/null 2>&1 || { echo "ERROR: NSIS installer (.exe) was not produced"; exit 1; }
          ls dist/*Portable*.exe >/dev/null 2>&1 || { echo "ERROR: portable (.exe) was not produced"; exit 1; }
          echo "Windows packages verified OK"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*Setup*.exe
            dist/*Portable*.exe
          if-no-files-found: error

  build-linux:
    name: Linux (deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux deb
        run: npx electron-builder --linux deb --publish never

      - name: Verify deb package, icon and desktop entry
        run: |
          set -euo pipefail
          echo "dist contents:"
          ls -la dist
          ls dist/*.deb >/dev/null 2>&1 || { echo "ERROR: .deb package was not produced"; exit 1; }
          deb="$(ls dist/*.deb | head -n1)"
          # Write the listing to a file: piping into `grep -q` closes the pipe
          # early and, with pipefail, makes dpkg-deb fail with a SIGPIPE.
          dpkg-deb -c "$deb" > deb-contents.txt
          grep -E '/usr/share/icons/hicolor/.*/apps/.*\.png' deb-contents.txt \
            || { echo "ERROR: PNG icon missing from deb"; exit 1; }
          grep -E '\.desktop' deb-contents.txt \
            || { echo "ERROR: .desktop entry missing from deb"; exit 1; }
          echo "Linux deb verified OK: $deb"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List packages
        run: find artifacts -type f -print

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
